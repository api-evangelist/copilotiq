name: CopilotIQ
description: 'CopilotIQ is a Nashville, Tennessee remote patient monitoring and telehealth
  company, founded in 2021, that delivers AI-driven chronic-condition management to seniors
  and Medicare members living with type 2 diabetes and hypertension. Through connected
  in-home devices, predictive analytics, and clinical automation it captures daily biometric
  readings and pairs them with weekly nurse coaching to catch anomalies early, reduce
  hospitalizations, and lower costs for health plans and providers. In October 2024 CopilotIQ
  merged with in-home care company Biofourmis. It was surfaced as a portfolio company of
  Bessemer Venture Partners and the SoftBank Vision Fund. CopilotIQ operates as a clinical
  care service and does not publish a public developer API or documentation surface.'
